[package]
name = "worklog"
version = "0.1.0"
description = "WorkLog - 工作汇报采集器（与飞书闭环）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25", features = ["jpeg"] }
xcap = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
